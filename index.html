<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b14">
<title>One Year — IELTS 7.0 ga 1 yil</title>
<style>
:root{
  --bg:#070b14;--bg2:#0b1222;--surf:rgba(255,255,255,.045);--surf2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.1);--txt:#eef2ff;--mut:#9aa7c7;--acc:#6366f1;--acc2:#22d3ee;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--gold:#f59e0b;
  --r:18px;--sh:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{--bg:#f5f7fd;--bg2:#ffffff;--surf:rgba(16,24,48,.045);--surf2:rgba(16,24,48,.08);--line:rgba(16,24,48,.12);--txt:#101828;--mut:#5b6a8c;--sh:0 10px 26px rgba(20,30,60,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;font-size:var(--fs,15px);line-height:1.5;overscroll-behavior-y:none}
img{max-width:100%}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--acc2)}
.hide{display:none!important}
.grad{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.gtxt{background:linear-gradient(135deg,var(--acc2),#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
::-webkit-scrollbar{width:0;height:0}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding:0 14px 110px}
.padT{padding-top:calc(env(safe-area-inset-top) + 10px)}
.glass{background:var(--surf);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mut{color:var(--mut)}
.sm{font-size:.83rem}
.xs{font-size:.74rem}
.b{font-weight:700}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt{margin-top:12px}.mt2{margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:700;background:var(--surf2);border:1px solid var(--line);transition:.15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.35)}
.btn.ok{background:linear-gradient(135deg,#10b981,#34d399);border-color:transparent;color:#04231a}
.btn.bad{background:linear-gradient(135deg,#ef4444,#f87171);border-color:transparent;color:#fff}
.btn.gho{background:transparent}
.btn.full{width:100%}
.btn.sm{padding:7px 11px;border-radius:11px;font-size:.82rem}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surf2);border:1px solid var(--line)}
.inp{width:100%;padding:12px 14px;border-radius:14px;background:var(--surf);border:1px solid var(--line);outline:none}
.inp:focus{border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);font-size:.74rem;font-weight:600}
.tagA1{background:rgba(52,211,153,.16);color:#34d399}
.tagA2{background:rgba(34,211,238,.16);color:#22d3ee}
.tagB1{background:rgba(96,165,250,.16);color:#60a5fa}
.tagB2{background:rgba(167,139,250,.16);color:#a78bfa}
.tagC1{background:rgba(251,191,36,.16);color:#fbbf24}
.tagC2{background:rgba(244,114,182,.16);color:#f472b6}
.bar{height:8px;border-radius:99px;background:var(--surf2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.ring{--p:0;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc2) calc(var(--p)*1%),var(--surf2) 0);position:relative}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg2)}
.ring>span{position:relative;z-index:2;font-weight:800;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .btn{min-width:0;padding-left:6px;padding-right:6px;overflow:hidden;text-overflow:ellipsis}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid4 .btn{min-width:0;padding-left:4px;padding-right:4px;overflow:hidden;text-overflow:ellipsis;font-size:.78rem}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
.stat b{display:block;font-size:1.15rem;line-height:1.2}
.stat span{font-size:.68rem;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px;background:var(--surf);border:1px solid var(--line);border-radius:16px}
.tabs>button{flex:0 0 auto;padding:9px 13px;border-radius:12px;font-weight:700;font-size:.84rem;color:var(--mut);white-space:nowrap}
.tabs>button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.lvl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 13px;border-radius:15px;background:var(--surf);border:1px solid var(--line);width:100%}
.lvl.on{border-color:var(--acc);background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(34,211,238,.10))}
.lvl.lock{opacity:.55}
.blk{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--surf);border:1px solid var(--line);width:100%}
.blk.done{border-color:rgba(52,211,153,.5)}
.blk.cur{border-color:var(--acc2);box-shadow:0 0 0 1px rgba(34,211,238,.35) inset}
.wcard{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:16px}
.wnum{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:var(--surf2);flex:0 0 auto}
.syn{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.syn>span{padding:3px 9px;border-radius:8px;background:var(--surf2);border:1px solid var(--line);font-size:.76rem}
.ctx{background:rgba(99,102,241,.10);border:1px solid rgba(99,102,241,.28);border-radius:14px;padding:11px 12px;font-size:.85rem}
.exq{background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.25);border-radius:14px;padding:11px 12px;font-style:italic}
.sentok{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.3);border-radius:12px;padding:10px 12px;font-size:.85rem}
.senterr{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35);border-radius:12px;padding:10px 12px;font-size:.8rem;color:#fca5a5}
.vid{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid .ply{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.cmt{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px}
.cmt.pin{border-color:var(--gold);background:rgba(245,158,11,.10)}
.ava{width:34px;height:34px;border-radius:11px;object-fit:cover;flex:0 0 auto}
.avab{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;flex:0 0 auto}
.yt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:16px;background:linear-gradient(135deg,rgba(255,0,0,.16),rgba(255,0,0,.05));border:1px solid rgba(255,60,60,.35)}
.qopt{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:14px;background:var(--surf);border:1px solid var(--line);margin-bottom:8px;font-weight:600}
.qopt.sel{border-color:var(--acc);background:rgba(99,102,241,.16)}
.qopt.right{border-color:var(--ok);background:rgba(52,211,153,.18)}
.qopt.wrong{border-color:var(--bad);background:rgba(248,113,113,.16)}
.skbtn{position:relative;border-radius:20px;padding:16px;text-align:left;overflow:hidden;border:1px solid var(--line);background:var(--surf);min-height:112px;display:flex;flex-direction:column;justify-content:flex-end}
.skbtn .em{position:absolute;right:-6px;top:-10px;font-size:56px;opacity:.16}
.searchres{padding:11px 12px;border-radius:14px;background:var(--surf);border:1px solid var(--line);width:100%;text-align:left;display:block}
.alph{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px}
.alph>button{flex:0 0 auto;width:34px;height:34px;border-radius:11px;background:var(--surf);border:1px solid var(--line);font-weight:700;font-size:.78rem}
.alph>button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.sheet>.in{width:100%;max-width:640px;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,rgba(7,11,20,0),rgba(7,11,20,.92) 40%);backdrop-filter:blur(14px)}
[data-theme="light"] .nav{background:linear-gradient(180deg,rgba(245,247,253,0),rgba(245,247,253,.95) 40%)}
.nav>.in{display:flex;gap:4px;max-width:640px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:var(--sh)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;color:var(--mut);font-size:.62rem;font-weight:700}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.nav svg{width:20px;height:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:90;padding:10px 16px;border-radius:14px;background:#111a2e;border:1px solid var(--line);font-size:.84rem;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;bottom:112px}
.adm{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);z-index:70;padding:7px 13px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#f43f5e);color:#fff;font-size:.72rem;font-weight:800;box-shadow:0 6px 18px rgba(244,63,94,.35);display:none;align-items:center;gap:6px}
.hdr{position:sticky;top:0;z-index:40;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;background:linear-gradient(180deg,var(--bg) 62%,rgba(7,11,20,0));backdrop-filter:blur(10px)}
.hdr .ttl{min-width:0}
.hdr .ttl .sec-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs{display:flex;align-items:center;gap:4px;margin-top:3px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex:0 0 auto;padding:2px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-size:.66rem;font-weight:700;line-height:1.5;white-space:nowrap;cursor:pointer}
.crumb:active{transform:scale(.96)}
.crumb.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.crumb-sep{flex:0 0 auto;color:var(--mut);font-size:.66rem;opacity:.7}
.hdr .icon-btn{flex:0 0 auto}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:1.25rem;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 22px rgba(99,102,241,.4);flex:0 0 auto;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.badge{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#f59e0b,#f43f5e);color:#fff;font-size:.6rem;font-weight:900;border:2px solid var(--bg2)}
.sec-t{font-weight:800;font-size:1.02rem;margin:0}
.lnk{color:var(--acc2);font-weight:700}
.hr{height:1px;background:var(--line);margin:12px 0}
.swatch{width:34px;height:34px;border-radius:11px;border:2px solid transparent;flex:0 0 auto}
.swatch.on{border-color:#fff}
input[type=color]{width:44px;height:36px;border:0;background:none;padding:0}
.switch{width:46px;height:27px;border-radius:99px;background:var(--surf2);border:1px solid var(--line);position:relative;flex:0 0 auto;transition:.2s}
.switch.on{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:21px}
.fab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:55;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 10px 26px rgba(99,102,241,.45)}
.chart{display:flex;align-items:flex-end;gap:6px;height:96px}
.chart>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.chart i{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--acc2),var(--acc));display:block;min-height:3px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.glow{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;pointer-events:none}
</style>
</head>

      '<button class="btn sm gho" onclick="App.delVid(\''+v.id+'\')">🗑</button></div>').join('')||'<div class="card mut center mt">'+esc(t('noVid'))+'</div>';}
  if(tab==='cmts'){
    const list=(D.comments||[]).slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts);
    h+=list.length?list.map(c=>'<div class="card mt row"><div class="grow"><div class="b sm">'+esc(c.name||'—')+'</div>'+
      '<div class="sm">'+esc(c.text)+'</div></div><div class="row" style="gap:6px">'+
      '<button class="btn sm gho" onclick="App.pinCmt(\''+c.id+'\')">'+(c.pin?'📌↓':'📌↑')+'</button>'+
      '<button class="btn sm gho" onclick="App.delCmt(\''+c.id+'\')">🗑</button></div></div>').join(''):
      '<div class="card mut center mt">'+esc(t('nocom'))+'</div>';}
  if(tab==='inbox'){
    const list=(D.msgs||[]).slice().reverse();
    h+=list.length?list.map(m=>'<div class="card mt"><div class="row between"><b class="sm">'+esc(m.name||'—')+'</b>'+
      '<span class="xs mut">'+new Date(m.ts).toLocaleString()+'</span></div>'+
      '<div class="sm mt">'+esc(m.text)+'</div>'+
      '<div class="row mt" style="gap:6px"><button class="btn sm gho" onclick="App.reply(\''+m.id+'\')">↩ '+esc(t('send'))+'</button>'+
      '<button class="btn sm gho" onclick="App.delMsg(\''+m.id+'\')">🗑</button></div></div>').join(''):
      '<div class="card mut center mt">'+esc(t('noMsg'))+'</div>';}
  if(tab==='users'){
    h+='<div class="card mt"><div class="grid2"><div class="stat"><b>'+totalWords()+'</b><span>'+esc(t('memorizedN'))+'</span></div>'+
      '<div class="stat"><b>'+acc()+'%</b><span>'+esc(t('accuracy'))+'</span></div></div>'+
      '<div class="hr"></div><div class="sm mut">'+esc(t('users'))+': local only</div></div>';}
  return h}

function viewSkill(sk){
  let h=head(t(SKN[sk]||'video'),true);
  const list=(D.videos||[]).filter(v=>v.sk===sk);
  h+='<div class="card mt row between"><div class="b">'+esc(t('skills'))+'</div><div class="grid4">'+
    SK.map(s=>'<button class="icon-btn '+(s.k===sk?'':'gho')+'" style="width:34px;height:34px" onclick="App.go(\'skill\','+s.k+')">'+s.ic+'</button>').join('')+'</div></div>';
  h+=list.length?list.map(vidItem).join(''):'<div class="card mut center mt2">'+esc(t('noVid'))+'</div>';
  return h}

function viewAllVid(){
  let h=head(t('video'),true);
  h+=(D.videos||[]).map(vidItem).join('')||'<div class="card mut center mt">'+esc(t('noVid'))+'</div>';
  return h}

function viewVid(id){
  const v=(D.videos||[]).find(x=>x.id===id);if(!v)return head(t('video'),true)+'<div class="card mt">'+esc(t('noVid'))+'</div>';
  if(!D.plays[id]){D.plays[id]=1;markAct()}
  let h=head(v.t,true);
  h+=v.yt?'<div class="vid mt"><iframe style="width:100%;height:100%;border:0" src="https://www.youtube.com/embed/'+esc(v.yt)+'" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>':
    '<div class="yt mt" onclick="App.ytSearch(\''+esc(v.q||v.t)+'\')" style="cursor:pointer"><b class="grow">▶️ '+esc(v.q||v.t)+'</b><span class="chip">YouTube</span></div>';
  h+='<div class="row between mt"><div><div class="b">'+esc(v.t)+'</div>'+
    '<div class="xs mut">'+esc(SKN[v.sk]||'video')+(v.lv?' · '+esc(v.lv):'')+(v.d?' · '+esc(v.d):'')+'</div></div>'+
    '<button class="icon-btn" onclick="App.shareVid(\''+v.id+'\')">↗</button></div>';
  h+='<button class="btn full mt" onclick="App.watch(\''+v.id+'\')">✓ '+esc(t('listened'))+'</button>';
  h+=commentsHtml(v.id);
  save();
  return h}

function sh(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=x[i];x[i]=x[j];x[j]=t}return x}
const ri=n=>Math.floor(Math.random()*n);
const norm=s=>String(s||'').toLowerCase().replace(/[^a-zа-я']/g,'');
function maskLetters(w){return w.split('').map(c=>c==='-'?'-':'_').join('')!==w.split('').map(c=>c==='-'?'-':'_').join('')?w:Array(w.length+1).join('_')}
function buildTest(l,b){
  const ws=bwords(l,b),qs=[];
  const others=i=>sh(ws.filter((x,j)=>j!==i).map(x=>x.w)).slice(0,3);
  const othersTr=i=>sh(ws.filter((x,j)=>j!==i).map(x=>x.tr)).slice(0,3);
  let i=ri(ws.length);let w=ws[i];
  qs.push({type:'mcq',h:t('mcq'),q:w.w,o:sh([w.tr].concat(othersTr(i))),a:w.tr});
  i=ri(ws.length);w=ws[i];
  const wrongSyn=(ws[ri(ws.length)].syn||[])[ri(3)]||'common';
  qs.push({type:'mcq',h:t('synq'),q:w.w,o:sh(w.syn.concat([wrongSyn])),a:w.syn[0]});
  i=ri(ws.length);w=ws[i];
  const masked=w.ex.replace(new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),'_____');
  qs.push({type:'mcq',h:t('gapfill'),q:masked,o:sh([w.w].concat(others(i))),a:w.w});
  i=ri(ws.length);w=ws[i];
  const sc=w.w.split('');const letters=sh(sc).join('');
  qs.push({type:'in',h:t('spelling'),q:maskLetters(w.w),hint:letters,a:w.w});
  i=ri(ws.length);w=ws[i];
  qs.push({type:'mcq',h:t('usetest'),q:w.ctx,o:sh([w.w].concat(others(i))),a:w.w});
  i=ri(ws.length);w=ws[i];
  qs.push({type:'in',h:t('tr2w'),q:w.tr,a:w.w});
  return sh(qs).slice(0,6)}

function viewTest(l,b){
  if(!App.T||App.T.l!==l||App.T.b!==b){App.T={l:l,b:b,qs:buildTest(l,b),i:0,ans:[],done:false}}
  const T=App.T;
  let h=head(t('test'),true);
  if(T.done){
    const sc=T.score,ok=sc>=60;
    h+='<div class="card mt center"><div style="font-size:2.6rem">'+(ok?'🎉':'💪')+'</div>'+
      '<div class="ring" style="--p:'+sc+';margin:12px auto"><span>'+sc+'%</span></div>'+
      '<div class="b" style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+esc(ok?t('pass').replace('{s}',sc):t('fail').replace('{s}',sc))+'</div></div>';
    const key=l+'_'+b;
    if(!T.scored){T.scored=true;
      if(ok){const was=lvlDone(l);D.tests[key]={s:sc,p:1,ts:Date.now()};save();
        if(l+''&&D.tests[key]&&!was&&blkCountDone(l)>=BLOCKS[l])toast(t('doneLvl'));}
      else{D.tests[key]=Object.assign({},D.tests[key]||{},{s:sc,p:0});save()}}
    h+='<div class="grid2 mt">'+(b>0?'<button class="btn" onclick="App.go(\'block\',\''+l+','+(b-1)+'\')">‹ '+esc(t('again'))+'</button>':'')+
      (b+1<BLOCKS[l]?'<button class="btn pri" onclick="App.go(\'test\',\''+l+','+(b+1)+'\')">'+esc(t('nextb'))+'</button>':'')+'</div>'+
      '<button class="btn full mt" onclick="App.go(\'level\',\''+l+'\')">'+esc(t('learn'))+'</button>';
    return h}
  const q=T.qs[T.i];
  h+='<div class="row between mt"><span class="chip">'+esc(t('test'))+'</span><span class="xs mut">'+esc(t('tapQ'))+' '+(T.i+1)+esc(t('of').replace('{n}',T.qs.length))+'</span></div>'+
    '<div class="bar mt" style="margin-bottom:12px"><i style="width:'+Math.round((T.i+1)/T.qs.length*100)+'%"></i></div>';
  h+='<div class="card"><div class="xs mut">'+esc(q.h)+'</div>'+
    '<div class="b mt" style="font-size:'+(q.type==='mcq'?'1.3rem':'1.05rem')+'">'+esc(q.q)+'</div>';
  if(q.type==='mcq'){h+='<div class="mt">'+q.o.map(o=>'<button class="qopt'+(T.ans[T.i]===o?' sel':'')+'" onclick="App.pick(\''+esc(o).replace(/'/g,'')+'\')">'+esc(o)+'</button>').join('')+'</div>'}
  else{h+='<input class="inp mt" id="ans" placeholder="'+esc(t('word'))+'" oninput="App.ansv=this.value" value="'+esc(T.ans[T.i]||'')+'">'+
    (q.hint&&T.ans[T.i]&&norm(T.ans[T.i])!==norm(q.a)?'<div class="xs mut mt">💡 '+esc(q.hint)+'</div>':'')}
  h+='<button class="btn pri full mt" onclick="App.nextQ()">'+(T.i<T.qs.length-1?esc(t('go')):'✓ '+esc(t('done')))+'</button></div>';
  return h}

function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheet';d.id='sh';
  d.innerHTML='<div class="in">'+html+'<button class="btn gho full mt" onclick="App.closeSheet()">'+esc(t('close'))+'</button></div>';
  d.onclick=e=>{if(e.target===d)App.closeSheet()};document.body.appendChild(d)}
function closeSheet(){const d=$('#sh');if(d)d.remove()}

const NAV=[['home','🏠','home'],['learn','📚','learn'],['search','🔎','search'],['basket','🧺','basket'],['profile','👤','profile']];
function navHtml(cur){const c=navFor(cur);
  return NAV.map(n=>'<button class="'+(c===n[2]?'on':'')+'" onclick="App.go(\''+n[2]+'\')"><span>'+n[1]+'</span>'+esc(t(n[2]))+'</button>').join('')}

const ROUTES={
 home:()=>viewHome(),learn:a=>viewLearn(a[0]),level:a=>viewLevel(a[0]),block:a=>viewBlock(a[0],+(a[1]||0)),
 test:a=>viewTest(a[0],+(a[1]||0)),search:()=>viewSearch(App.q||''),basket:()=>viewBasket(),profile:()=>viewProfile(),
 call:()=>viewCall(),settings:()=>viewSettings(),admin:a=>viewAdmin(a[0]||'brand'),
 skill:a=>viewSkill(+a[0]),allvid:()=>viewAllVid(),vid:a=>viewVid(a[0])};

function route(){let r=(location.hash||'#/home').replace(/^#\/?/,'').replace(/,/g,'/');const p=r.split('/');const n=p[0]||'home';
  const f=ROUTES[n]||ROUTES.home;let h='';
  closeSheet();
  try{h=f(p.slice(1))}catch(e){h='<div class="card mt err">'+esc(String(e))+'</div>'}
  $('#app').innerHTML=h;$('#nav').innerHTML=navHtml(n);
  document.documentElement.setAttribute('data-theme',S.theme);
  document.documentElement.style.setProperty('--fs',S.fs+'px');
  document.documentElement.style.setProperty('--acc',S.accent||'#6366f1');
  if(n==='search'&&App.q){const q=$('#q');if(q&&document.activeElement!==q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length)}catch(e){}}}
  const fab=$('#fab');fab.classList.toggle('hide',!(n==='basket'&&D.basket.length));
  fab.innerHTML='↗';
  if(tg&&tg.BackButton){if(r!=='home')tg.BackButton.show();else tg.BackButton.hide()}
  window.scrollTo(0,0);}
function render(){route()}

const App={
  q:'',idx:0,T:null,ansv:'',_t:null,
  go:function(n,a){
    if(n==='search'&&(a===undefined||a===''))App.q='';
    if(n==='learn'||n==='level'||n==='block'||n==='test')App.idx=0;
    if(n==='test')App.T=null;
    const h=(a!==undefined&&a!=='')?'#/'+n+'/'+String(a).replace(/,/g,'/'):'#/'+n;
    if(location.hash===h){App.T=null;route();return}
    location.hash=h;},
  goHash:function(h){if(location.hash===h)route();else location.hash=h},
  back:function(){if(location.hash==='#/home'||location.hash==='')return;
    const tr=crumbTrail();
    if(tr.length>1){App.goHash(tr[tr.length-2].h);return}
    history.back();setTimeout(function(){if(location.hash==='#/home'||location.hash==='')App.go('home')},80)},
  goq:function(n,q){App.q=q;App.go('search')},
  fab:function(){if(location.hash.indexOf('basket')>=0)App.exportBasket()},
  lockInfo:function(l){toast(t('lockinfo').replace('{l}',LV[LV.indexOf(l)-1]||''))},
  say:function(w){say(w,.92);buzz('light')},
  saySlow:function(w){say(w,.55);buzz('light')},
  searchDebounce:function(){clearTimeout(App._t);App._t=setTimeout(function(){App.q=$('#q')?$('#q').value:'';
    const s=window.scrollY;route();window.scrollTo(0,s)},220)},
  ytGo:function(){const q=($('#ytq')&&$('#ytq').value.trim())||'IELTS 7.0';window.open(ytSearch(q),'_blank');buzz('light')},
  ytSearch:function(q){window.open(ytSearch(q),'_blank')},
  openVid:function(id){App.go('vid',id)},
  shareVid:function(id){const v=(D.videos||[]).find(x=>x.id===id)||{};
    const u=v.yt?ytUrl(v.yt):ytSearch(v.q||v.t);share(u,S.appName+' — '+(v.t||''))},
  share:function(){share(location.href,S.appName+' — '+(S.hero||t('desc')))},
  setI:function(i){App.idx=i;route()},
  nextWord:function(id){
    const l=id.split('_')[0],v=WORDS[l].find(x=>x.id===id),ta=$('#sen');
    if(!D.words[id]){
      if(!ta||!ta.value.trim()){toast(t('senerr').replace('{w}',v.w));if(ta)ta.focus();return}
      App.chkSen(id);
      if(!D.words[id])return;
    }
    const p=(location.hash||'').split('/'),b=+(p[3]||0);
    let i=App.idx+1;if(i>=bwords(l,b).length){App.finishBlock(l,b)}else{App.idx=i;route()}},
  chkSen:function(id){const ta=$('#sen'),m=$('#senmsg');if(!ta)return;
    const w=id.split('_')[0],v=WORDS[w].find(x=>x.id===id);const txt=ta.value.trim();
    const wc=txt.split(/\s+/).filter(Boolean).length;
    if(!txt||wc<3||txt.toLowerCase().indexOf(v.w.toLowerCase())<0){
      if(m){m.className='senterr';m.textContent=t('senerr').replace('{w}',v.w);m.style.display=''}return}
    D.words[id]={m:1,s:txt,t:Date.now()};save();markAct();
    if(m){m.className='sentok';m.textContent='✓ '+t('senok');m.style.display=''}
    buzz('ok');setTimeout(function(){App.nextWord(id)},700)},
  finishBlock:function(l,b){App.go('test',l+','+b)},
  pick:function(o){App.T.ans[App.T.i]=o;route()},
  nextQ:function(){const T=App.T;if(T.ans[T.i]===undefined||T.ans[T.i]===''){toast(t('tapQ'));return}
    if(T.i>=T.qs.length-1){let c=0;T.qs.forEach((q,i)=>{const a=T.ans[i]||'';if(norm(a)===norm(q.a))c++});
      T.score=Math.round(c/T.qs.length*100);T.done=true}else T.i++;route()},
  toggleBasket:function(w){const i=D.basket.indexOf(w);
    if(i>=0){D.basket.splice(i,1);toast(t('removed'))}else{D.basket.push(w);toast(t('saved'));buzz('ok')}
    save();route()},
  clearBasket:function(){if(confirm(t('delQ'))){D.basket=[];save();render()}},
  exportBasket:function(){const lines=D.basket.map(w=>{const r=SEARCH_DICT.find(x=>x[0]===w);return w+' — '+(r?r[1]:'')+' ('+(r?POSN[r[2]]||r[2]:'')+')'});
    share('',S.appName+' · '+t('baskWords')+'\n\n'+lines.join('\n'))},
  exportData:function(){share('',JSON.stringify({S:S,stat:{words:totalWords(),acc:acc(),streak:streak()}},null,1))},
  addCmt:function(vid){const el=$('#cmt');if(!el||!el.value.trim())return;
    D.comments=D.comments||[];D.comments.push({id:uid(),text:el.value.trim(),name:(U?(U.first_name||''):'Guest'),ts:Date.now(),vid:vid||'',pin:0});
    save();markAct();buzz('ok');route()},
  pinCmt:function(id){const c=(D.comments||[]).find(x=>x.id===id);if(!c)return;c.pin=c.pin?0:1;save();route();toast(c.pin?t('pin'):t('unpin'))},
  delCmt:function(id){if(!IS_ADMIN)return;if(!confirm(t('delQ')))return;D.comments=(D.comments||[]).filter(x=>x.id!==id);save();route()},
  openAdminChat:function(){try{tg&&tg.openTelegramLink('https://t.me/'+ADMIN_NAME)}catch(e){window.open('https://t.me/'+ADMIN_NAME,'_blank')}},
  sendMsg:function(){const el=$('#gmsg');if(!el||!el.value.trim())return;
    D.msgs=D.msgs||[];D.msgs.push({id:uid(),text:el.value.trim(),name:(U?(U.first_name||''):'Guest'),ts:Date.now(),kind:'general'});
    save();el.value='';toast(t('msgOk'));buzz('ok');route()},
  reply:function(id){const m=(D.msgs||[]).find(x=>x.id===id);if(!m)return;
    App.ansv=m.text;location.hash='#/call';setTimeout(function(){const e=$('#gmsg');if(e)e.value='@'+m.name+' '},200)},
  delMsg:function(id){if(!IS_ADMIN)return;D.msgs=(D.msgs||[]).filter(x=>x.id!==id);save();route()},
  setLang:function(l){S.lang=l;save();route()},
  setTheme:function(t){S.theme=t;save();route()},
  setFs:function(v){S.fs=+v;save();const e=$('#fsv');if(e)e.textContent=v+'px';document.documentElement.style.setProperty('--fs',v+'px')},
  setNotify:function(){S.notify=!S.notify;save();route();if(S.notify&&tg&&tg.showSwitchFeedback)tg.showSwitchFeedback()},
  reset:function(){if(!confirm(t('resetQ')))return;localStorage.removeItem(LS);D={words:{},tests:{},basket:[],comments:[],msgs:[],videos:DEFAULT_VIDEOS.map(v=>defaultVid(v)),act:{},created:Date.now(),plays:{}};save();location.hash='#/home';route()},
  pickLogo:function(){const f=$('#logof');if(f)f.click()},
  setLogo:function(el){if(!el){S.logo='';save();route();return}
    const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();
    r.onload=function(){S.logo=r.result;save();route();toast(t('saved2'))};r.readAsDataURL(f)},
  setBrand:function(k,v){S[k]=v;save();render()},
  setAccent:function(c){S.accent=c;document.documentElement.style.setProperty('--acc',c);save()},
  addVid:function(){const g=id=>{const e=$(id);return e?e.value.trim():''};
    const title=g('#vt'),y=g('#vy'),d=g('#vd');if(!title){toast(t('vidT'));return}
    const id=pickId(y);
    D.videos=D.videos||[];D.videos.unshift({id:uid(),t:title,sk:+g('#vs')||1,lv:g('#vl'),yt:id,q:id?'':y,d:d});
    save();toast(t('saved2'));route()},
  delVid:function(id){if(!IS_ADMIN)return;if(!confirm(t('delQ')))return;D.videos=(D.videos||[]).filter(x=>x.id!==id);save();route()},
  watch:function(id){D.plays[id]=2;markAct();save();toast('✓');buzz('ok')},
  closeSheet:closeSheet
};

function tgSetup(){initTg();if(!tg)return;
  try{tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#070b14');
    if(tg.enableClosingConfirmation)tg.enableClosingConfirmation();
    if(tg.BackButton){tg.BackButton.onClick(function(){App.back()})}
    if(tg.onEvent)tg.onEvent('themeChanged',function(){});
  }catch(e){}}
function boot(){load();route();tgSetup();cloudGet()}
window.addEventListener('hashchange',function(){App.T=null;route()});
if(tg){boot()}
else{
  boot();
  const sc=document.createElement('script');
  sc.src='https://telegram.org/js/telegram-web-app.js';
  sc.onload=function(){tgSetup();cloudGet()};
  sc.onerror=function(){};
  document.head.appendChild(sc);
}
